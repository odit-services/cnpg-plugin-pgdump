name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Create GitHub Release
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Render release deployment manifest
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          image="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          sed "s|image: platform/cnpg-plugin-pgdump:latest|image: ${image}|" \
            kubernetes/deployment.yaml > dist/cnpg-plugin-pgdump-deployment.yaml
          cp -R kubernetes/quickstart dist/quickstart
          sed -i "s|newTag: main|newTag: ${IMAGE_TAG}|" dist/quickstart/kustomization.yaml
          sed -i "s|branch: main|tag: ${GITHUB_REF_NAME}|" dist/quickstart/flux/gitrepository.yaml
          sed -i "s|targetRevision: main|targetRevision: ${GITHUB_REF_NAME}|" dist/quickstart/argocd/application.yaml
          tar -C dist -czf dist/cnpg-plugin-pgdump-quickstart.tar.gz quickstart

      - name: Extract release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          awk -v tag="$tag" -v version="$version" '
            /^### / { line=$0; gsub(/\[|\]\([^)]*\)/, "", line); if (index(line, tag) || index(line, "v" version) || index(line, version)) { capture=1; next } }
            capture && /^### / { exit }
            capture { print }
          ' CHANGELOG.md > dist/release-notes.md
          if [ ! -s dist/release-notes.md ]; then
            cp CHANGELOG.md dist/release-notes.md
          fi
          cat >> dist/release-notes.md <<'EOF'

          Bundled pg_dump versions: 14, 15, 16, 17, 18
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/cnpg-plugin-pgdump-deployment.yaml \
            dist/cnpg-plugin-pgdump-quickstart.tar.gz \
            --title "${GITHUB_REF_NAME}" \
            --notes-file dist/release-notes.md \
            --verify-tag \
            --draft

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/cnpg-plugin-pgdump-deployment.yaml
            dist/cnpg-plugin-pgdump-quickstart.tar.gz
